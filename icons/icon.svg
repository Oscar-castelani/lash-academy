<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cintia Pereyra - Lash Academy Professional">
  <!--
    Icono de la app: monograma CP en cursiva dorada sobre fondo negro.
    Las letras estan convertidas a curvas (no depende de que la fuente
    Monotype Corsiva este instalada). Este SVG es el ORIGINAL: los PNG de
    /icons se generan a partir de el (ver README).
    Todo el dibujo entra en el circulo central del 80% para que Android no lo
    recorte al aplicar la mascara (maskable).
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241A28"/>
      <stop offset="0.55" stop-color="#0E0A10"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="oro" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#F9EBBE"/>
      <stop offset="0.3" stop-color="#E0BC6B"/>
      <stop offset="0.55" stop-color="#B98A2E"/>
      <stop offset="0.78" stop-color="#E6C67F"/>
      <stop offset="1" stop-color="#F7E6B4"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#fondo)"/>

  <!-- Aro fino que encuadra el monograma -->
  <circle cx="256" cy="256" r="187" fill="none" stroke="url(#oro)" stroke-width="6"/>

