<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lash Academy Professional</title>
  <meta name="description" content="Reservá tu turno, inscribite a los cursos y comprá insumos de Lash Academy Professional.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A1F45">

  <!-- iOS (Agregar a inicio desde Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lash Academy">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="alternate icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <style>
    /* ====================================================================
       PALETA — tomada de la página de Ágora (degradado violeta a magenta,
       botones blancos con texto oscuro).
       Para cambiar la estética, tocar SOLO estas variables. Si cambia
       --color-bg-top, actualizar también theme_color en manifest.json y el
       <meta name="theme-color"> de más arriba.
       ==================================================================== */
    :root {
      --color-bg-top: #4A1F45;      /* extremo superior del degradado */
      --color-bg-mid: #8A4485;      /* punto medio */
      --color-bg-bottom: #D98FD4;   /* extremo inferior */

      --color-surface: #FFFFFF;                 /* botones principales */
      --color-text-on-surface: #2E2130;
      --color-hint-on-surface: #6D5A6E;

      --color-heading: #FFFFFF;
      --color-subtitle: rgba(255, 255, 255, 0.78);

      --color-social-bg: rgba(255, 255, 255, 0.18);
      --color-social-border: rgba(255, 255, 255, 0.35);
      --color-social-icon: #FFFFFF;

      --color-install-btn: #7A3A76;      /* boton "Instalar" del cartel */
      --color-install-btn-text: #FFFFFF;

      --color-focus: #FFFFFF;

      --font-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;

      /* Medidas que cambian por breakpoint (ver media queries al final). */
      --content-max-width: 400px;
      --logo-size: 118px;
      --action-min-height: 72px;
      --action-radius: 14px;
      --stack-gap: 14px;    /* separación entre los botones */
      --block-gap: 26px;    /* separación entre bloques (header/botones/redes) */
    }

    * { box-sizing: border-box; }

    html {
      /* Pinta el rebote del scroll en iOS con el color del final del degradado. */
      background-color: var(--color-bg-bottom);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh; /* los navegadores viejos ignoran esta línea */

      background-color: var(--color-bg-mid); /* fallback si no hay degradado */
      background-image: linear-gradient(
        180deg,
        var(--color-bg-top) 0%,
        var(--color-bg-mid) 48%,
        var(--color-bg-bottom) 100%
      );
      background-repeat: no-repeat;

      color: var(--color-heading);
      font-family: var(--font-base);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;

      display: flex;
      flex-direction: column;
      padding:
        calc(28px + env(safe-area-inset-top))
        calc(20px + env(safe-area-inset-right))
        calc(28px + env(safe-area-inset-bottom))
        calc(20px + env(safe-area-inset-left));
    }

    /* Centrado vertical con margin auto en vez de justify-content: si el
       contenido no entra (pantallas bajas / landscape), no se recorta arriba. */
    main {
      width: 100%;
      max-width: var(--content-max-width);
      margin: auto;
    }

    /* Encabezado --------------------------------------------------------- */
    .header {
      text-align: center;
      margin-bottom: var(--block-gap);
    }

    .header__logo {
      width: var(--logo-size);
      height: var(--logo-size);
      display: block;
      margin: 0 auto 16px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 6px 20px rgba(30, 8, 28, 0.28);

      /* La foto es cuadrada y el contenedor tambien: "cover" la encuadra sin
         estirarla ni recortar la cara. Si alguna vez se cambia por una foto
         rectangular, ajustar object-position para dejar la cara centrada. */
      object-fit: cover;
      object-position: center center;
      background-color: rgba(255, 255, 255, 0.12);
    }

    .header__title {
      margin: 0;
      font-size: clamp(1.25rem, 5.6vw, 1.75rem);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .header__subtitle {
      margin: 8px 0 0;
      font-size: clamp(0.85rem, 3.6vw, 1rem);
      color: var(--color-subtitle);
    }

    /* Botones principales ------------------------------------------------ */
    .actions {
      display: block;
      margin-bottom: var(--block-gap);
    }

    .action {
      /* Área táctil holgada, por encima del mínimo de 44px. */
      min-height: var(--action-min-height);
      padding: 14px 18px;
      border-radius: var(--action-radius);
      text-decoration: none;

      background-color: var(--color-surface);
      color: var(--color-text-on-surface);
      box-shadow: 0 4px 14px rgba(43, 12, 40, 0.18);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;

      transition: transform 120ms ease, opacity 120ms ease;
    }

    .action + .action {
      margin-top: var(--stack-gap);
    }

    .action:active {
      transform: scale(0.97);
      opacity: 0.92;
    }

    .action:focus-visible {
      outline: 3px solid var(--color-focus);
      outline-offset: 3px;
    }

    .action__label {
      font-size: clamp(1rem, 4.2vw, 1.15rem);
      font-weight: 700;
      line-height: 1.25;
    }

    .action__hint {
      margin-top: 3px;
      font-size: clamp(0.78rem, 3.2vw, 0.9rem);
      color: var(--color-hint-on-surface);
      line-height: 1.25;
    }

    /* Redes sociales ------------------------------------------------------ */
    .social {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    .social__link {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--color-social-bg);
      border: 1px solid var(--color-social-border);
      color: var(--color-social-icon);

      display: flex;
      align-items: center;
      justify-content: center;

      transition: transform 120ms ease, opacity 120ms ease;
    }

    .social__link + .social__link {
      margin-left: 16px;
    }

    .social__link:active {
      transform: scale(0.92);
      opacity: 0.85;
    }

    .social__link:focus-visible {
      outline: 3px solid var(--color-focus);
      outline-offset: 3px;
    }

    .social__link svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Cartel flotante de instalación ------------------------------------- */
    .install {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));
      width: calc(100% - 28px);
      max-width: var(--content-max-width);

      /* Dos filas apiladas: la de siempre y, si se despliegan, los pasos.
         La de arriba NO envuelve, para que la X no se caiga al renglon de
         abajo en pantallas angostas. */
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      border-radius: 16px;

      background-color: rgba(255, 255, 255, 0.97);
      color: var(--color-text-on-surface);
      box-shadow: 0 10px 30px rgba(20, 5, 20, 0.38);

      /* Entra deslizándose desde abajo cuando se le agrega .is-visible. */
      opacity: 0;
      transform: translateX(-50%) translateY(140%);
      transition: transform 320ms ease, opacity 320ms ease;
    }

    /* Necesario porque .install fija display:flex y pisaría a [hidden]. */
    .install[hidden] { display: none; }

    .install.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .install__fila {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
    }

    .install__icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      flex-shrink: 0;
    }

    .install__text {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0 10px;
    }

    .install__title {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .install__hint {
      display: block;
      margin-top: 2px;
      font-size: 0.78rem;
      line-height: 1.25;
      color: var(--color-hint-on-surface);
    }

    .install__btn {
      flex-shrink: 0;
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      background-color: var(--color-install-btn);
      color: var(--color-install-btn-text);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    .install__btn:active { transform: scale(0.96); opacity: 0.9; }

    .install__close {
      position: relative;
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      margin-left: 4px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background-color: transparent;
      color: var(--color-hint-on-surface);
      font-family: inherit;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }

    /* Instrucciones paso a paso, para los navegadores que no tienen
       diálogo nativo de instalación. Se despliegan al tocar "Instalar". */
    .install__pasos {
      margin: 10px 2px 2px;
      padding-top: 10px;
      border-top: 1px solid rgba(46, 33, 48, 0.14);
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--color-text-on-surface);
    }

    .install__pasos[hidden] { display: none; }

    /* Cada paso en su renglón, con aire entre uno y otro. */
    .install__paso {
      display: block;
      margin-top: 5px;
    }

    /* El ícono de Compartir de iOS, embebido en el texto del paso 1. */
    .install__glifo {
      width: 1.15em;
      height: 1.15em;
      vertical-align: -0.25em;
    }

    /* Flecha que apunta a la barra de Safari, que es donde está Compartir. */
    .install__flecha {
      display: block;
      margin-top: 2px;
      text-align: center;
      font-size: 1.2rem;
      line-height: 1;
      color: var(--color-install-btn);
      animation: install-rebote 1.4s ease-in-out infinite;
    }

    @keyframes install-rebote {
      0%, 100% { transform: translateY(0); opacity: 0.55; }
      50%      { transform: translateY(4px); opacity: 1; }
    }

    /* Agranda el área táctil de la X a 48px sin agrandar el dibujo. */
    .install__close::after {
      content: "";
      position: absolute;
      top: -7px; right: -7px; bottom: -7px; left: -7px;
    }

    .install__close:active { opacity: 0.6; }

    .install__btn:focus-visible,
    .install__close:focus-visible {
      outline: 3px solid var(--color-install-btn);
      outline-offset: 2px;
    }

    /* Mientras el cartel está visible, se deja aire abajo para que nunca tape
       los íconos de redes. */
    body.has-install { padding-bottom: calc(104px + env(safe-area-inset-bottom)); }

    /* ====================================================================
       RESPONSIVE
       Base = celular chico. De ahí para arriba solo se agranda.
       ==================================================================== */

    /* Android viejos y iPhone SE / 5 (320-360px de ancho). */
    @media (max-width: 359px) {
      :root {
        --logo-size: 88px;
        --action-min-height: 64px;
        --stack-gap: 12px;
        --block-gap: 20px;
      }
      body { padding-left: 14px; padding-right: 14px; }
      .social__link { width: 44px; height: 44px; }
      .social__link + .social__link { margin-left: 12px; }

      .install { padding: 8px 10px; }
      .install__icon { width: 36px; height: 36px; }
      .install__text { margin: 0 8px; }
      .install__title { font-size: 0.88rem; }
      .install__hint { font-size: 0.72rem; }
      .install__btn { padding: 0 12px; font-size: 0.85rem; }
      .install__close { width: 28px; margin-left: 0; }
    }

    /* Celulares grandes: iPhone Pro Max, Android de 6.5"+ (410px en adelante). */
    @media (min-width: 410px) {
      :root {
        --content-max-width: 420px;
        --logo-size: 128px;
        --block-gap: 30px;
      }
    }

    /* Tablets chicas y celulares plegables abiertos (iPad mini, Galaxy Tab). */
    @media (min-width: 600px) {
      :root {
        --content-max-width: 480px;
        --logo-size: 152px;
        --action-min-height: 84px;
        --action-radius: 18px;
        --stack-gap: 18px;
        --block-gap: 36px;
      }
      .header__title { font-size: 2rem; }
      .header__subtitle { font-size: 1.05rem; }
      .action__label { font-size: 1.25rem; }
      .action__hint { font-size: 0.95rem; }
      .social__link { width: 56px; height: 56px; }
      .social__link + .social__link { margin-left: 20px; }
      .social__link svg { width: 26px; height: 26px; }

      .install { padding: 14px; border-radius: 20px; }
      .install__icon { width: 52px; height: 52px; border-radius: 14px; }
      .install__text { margin: 0 14px; }
      .install__title { font-size: 1.05rem; }
      .install__hint { font-size: 0.88rem; }
      .install__btn { min-height: 48px; padding: 0 22px; font-size: 1rem; }
      body.has-install { padding-bottom: calc(126px + env(safe-area-inset-bottom)); }
    }

    /* Tablets grandes (iPad Pro) y escritorio. */
    @media (min-width: 900px) {
      :root {
        --content-max-width: 520px;
        --logo-size: 168px;
      }
      .header__title { font-size: 2.25rem; }
    }

    /* En pantallas de poca altura el cartel desplegado no entra flotando sin
       tapar los íconos: pasa al flujo, debajo de las redes, y la página
       scrollea. */
    @media (max-height: 700px) {
      .install.is-expandido,
      .install.is-expandido.is-visible {
        position: static;
        width: 100%;
        max-width: var(--content-max-width);
        margin: 16px auto 0;
        opacity: 1;
        transform: none;
      }
    }

    /* Tablet acostada o ventana ancha pero baja: se vuelve a las medidas de
       celular, si no el contenido no entra a lo alto. */
    @media (min-width: 600px) and (max-height: 800px) {
      :root {
        --logo-size: 116px;
        --action-min-height: 72px;
        --stack-gap: 14px;
        --block-gap: 24px;
      }
      .header__title { font-size: 1.6rem; }
      .header__subtitle { font-size: 0.95rem; }
      .action__label { font-size: 1.1rem; }
      .action__hint { font-size: 0.88rem; }
      .social__link { width: 50px; height: 50px; }
      .social__link svg { width: 24px; height: 24px; }
      body.has-install { padding-bottom: calc(108px + env(safe-area-inset-bottom)); }
    }

    /* Pantallas bajas: celular acostado y teclados abiertos. Se compacta todo
       y, si aun así no entra, la página scrollea sin recortar el encabezado. */
    @media (max-height: 520px) {
      :root {
        --logo-size: 74px;
        --action-min-height: 56px;
        --stack-gap: 10px;
        --block-gap: 16px;
      }
      body { padding-top: 14px; padding-bottom: 14px; }
      .header__logo { margin-bottom: 10px; }
      .header__title { font-size: 1.15rem; }
      .header__subtitle { font-size: 0.85rem; }
      /* Anula los tamaños grandes del breakpoint de tablet: un celular
         acostado es ancho pero muy bajo. */
      .action { min-height: var(--action-min-height); padding: 10px 16px; }
      .action__label { font-size: 1rem; }
      .action__hint { font-size: 0.82rem; }
      .social__link { width: 44px; height: 44px; }
      .social__link svg { width: 22px; height: 22px; }

      /* En pantallas bajas no hay lugar para un cartel flotante sin tapar los
         íconos: pasa a ser parte del flujo, justo debajo de las redes. */
      .install {
        position: static;
        width: 100%;
        max-width: var(--content-max-width);
        margin: 16px auto 0;
        padding: 6px 10px;
        opacity: 1;
        transform: none;
      }
      .install.is-visible { transform: none; }
      .install__icon { width: 34px; height: 34px; }
      .install__hint { font-size: 0.72rem; }
      body.has-install { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
    }

    /* Respeta a quien pidió menos movimiento en el sistema. */
    @media (prefers-reduced-motion: reduce) {
      .action, .social__link, .install, .install__btn { transition: none; }
      .install__flecha { animation: none; opacity: 0.8; }
      .action:active, .social__link:active, .install__btn:active { transform: none; }
      .install { transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <header class="header">
      <img class="header__logo" id="logo" src="assets/cintia.jpg"
           alt="Cintia Pereyra" width="150" height="150"
           fetchpriority="high" decoding="async">
      <h1 class="header__title">Lash Academy Professional</h1>
      <p class="header__subtitle">Cintia Pereyra</p>
    </header>

    <!-- Los href se asignan desde config.js (ver script al final del body). -->
    <nav class="actions">
      <a class="action" data-link="turnos" target="_blank" rel="noopener noreferrer">
        <span class="action__label">Reservar turno</span>
        <span class="action__hint">Servicios y cursos</span>
      </a>

      <a class="action" data-link="insumos" target="_blank" rel="noopener noreferrer">
        <span class="action__label">Comprar insumos</span>
        <span class="action__hint">Catálogo de WhatsApp</span>
      </a>
    </nav>

    <nav class="social" aria-label="Redes sociales">
      <a class="social__link" data-link="instagram" target="_blank" rel="noopener noreferrer" aria-label="Instagram">

          <circle cx="18.41" cy="5.59" r="1.44"/>
        </svg>
      </a>

      <a class="social__link" data-link="whatsapp" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.06 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.62.71.23 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.42-.07-.12-.27-.2-.57-.35Z"/>

        </svg>
      </a>

      <a class="social__link" data-link="ubicacion" target="_blank" rel="noopener noreferrer" aria-label="Cómo llegar">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/>
        </svg>
      </a>
    </nav>
  </main>

  <!--
    Cartel flotante de instalación. Arranca oculto y el script de abajo lo
    muestra solo si la app NO está instalada. Se cierra con la X y no vuelve
    a molestar por 14 días.
  -->
  <aside class="install" id="install" hidden>
    <div class="install__fila">
      <!-- Sin src: se carga recien cuando el cartel se muestra (ver mostrar()). -->
      <img class="install__icon" data-src="icons/icon.svg" alt="" width="42" height="42" decoding="async">
      <div class="install__text">
        <strong class="install__title">Descargá la app</strong>
        <span class="install__hint" id="install-hint">Queda como ícono en tu celular</span>
      </div>
      <button class="install__btn" id="install-btn" type="button" aria-expanded="false" aria-controls="install-pasos">Instalar</button>
      <button class="install__close" id="install-close" type="button" aria-label="Cerrar aviso">&times;</button>
    </div>
    <p class="install__pasos" id="install-pasos" hidden></p>
  </aside>

  <script src="config.js"></script>
  <script>
    // ¿iPhone o iPad? Se usa para dos cosas: el enlace de la ubicación y las
    // instrucciones de instalación (más abajo).
    function esApple() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
             // iPad con iPadOS se identifica como Mac, pero tiene táctil.
             (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    // La ubicación abre la app de mapas que el teléfono ya tiene. En iPhone,
    // un enlace de Google Maps ofrece descargar la app de Google en vez de
    // abrir el mapa, así que ahí se usa Mapas de Apple.
    if (esApple() && CONFIG.ubicacionIOS) {
      CONFIG.ubicacion = CONFIG.ubicacionIOS;
    }

    // Asigna a cada enlace la URL correspondiente de CONFIG.
    document.querySelectorAll('[data-link]').forEach(function (el) {
      var url = CONFIG[el.dataset.link];
      if (url) {
        el.href = url;
      } else {
        // Enlace sin configurar: mejor ocultarlo que dejar un boton muerto.
        el.hidden = true;
        console.warn('CONFIG no tiene una URL para "' + el.dataset.link + '"');
      }
    });

    // Si la foto no estuviera disponible, se cae al icono de la app en vez de
    // mostrar el cuadrito roto.
    document.getElementById('logo').addEventListener('error', function () {
      this.src = 'icons/icon-512.png';
    });

    // Registro del service worker (habilita instalacion y cacheo offline).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function (err) {
          console.warn('No se pudo registrar el service worker:', err);
        });
      });
    }

    /* --------------------------------------------------------------------
       Cartel de instalación.

       Cada navegador instala distinto. El botón "Instalar" SIEMPRE está y
       siempre hace algo:

       1. Android (Chrome/Edge): el navegador avisa con 'beforeinstallprompt'.
          El botón abre el diálogo nativo de instalación.
       2. Cualquier otro caso (iPhone, navegador dentro de Instagram, Firefox,
          Chrome que todavía no disparó el evento): el botón despliega los
          pasos concretos para ese navegador.

       El caso del navegador de Instagram importa especialmente: la app se
       comparte desde la bio de Instagram, y su navegador interno NO puede
       instalar aplicaciones. Sin avisarlo, el botón parece roto.

       El cartel solo aparece si la app NO está instalada.
       -------------------------------------------------------------------- */
    (function () {
      var cartel = document.getElementById('install');
      var boton = document.getElementById('install-btn');
      var cerrar = document.getElementById('install-close');
      var pista = document.getElementById('install-hint');
      var pasos = document.getElementById('install-pasos');

      var promptDiferido = null;
      var CLAVE_DESCARTE = 'lash-install-descartado';
      var DIAS_DESCARTE = 14;

      var ua = navigator.userAgent;

      function estaInstalada() {
        return window.matchMedia('(display-mode: standalone)').matches ||
               window.matchMedia('(display-mode: fullscreen)').matches ||
               window.navigator.standalone === true ||           // iOS
               document.referrer.indexOf('android-app://') === 0; // TWA
      }

      var esIOS = esApple; // definida más arriba, junto a los enlaces

      // Navegadores embebidos dentro de otra app (Instagram, Facebook, etc.).
      // Ninguno puede instalar una PWA.
      function esNavegadorDeApp() {
        return /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Line\/|TikTok|Twitter/i.test(ua);
      }

      // Chrome, Firefox y Edge en iPhone. Por dentro son Safari, pero el menú
      // de compartir está en otro lado y confunde: conviene mandar a Safari.
      function esOtroNavegadorEnIOS() {
        return esIOS() && /CriOS|FxiOS|EdgiOS|OPT\//i.test(ua);
      }

      // Samsung Internet. Instala la PWA generando un APK propio que, en
      // Android 14 y posteriores, Play Protect a veces bloquea por apuntar a
      // una versión vieja del sistema. El APK lo arma el navegador, no
      // nosotros: desde acá no se puede cambiar. La salida es instalar desde
      // Chrome, que usa el servicio de Google y no da ese problema.
      function esSamsung() {
        return /SamsungBrowser/i.test(ua);
      }

      function descartadoHacePoco() {
        try {
          var t = parseInt(localStorage.getItem(CLAVE_DESCARTE), 10);
          return !!t && (Date.now() - t) < DIAS_DESCARTE * 86400000;
        } catch (e) {
          return false; // modo privado: no pasa nada, se muestra igual
        }
      }

      // Cuando el cartel flota sobre la pantalla, se reserva abajo el alto que
      // ocupa, para que nunca tape los íconos de redes. Se recalcula cada vez
      // porque al desplegar los pasos el cartel crece.
      function ajustarEspacio() {
        if (cartel.hidden || getComputedStyle(cartel).position !== 'fixed') {
          document.body.style.paddingBottom = '';
          return;
        }
        document.body.style.paddingBottom = (cartel.offsetHeight + 34) + 'px';
      }

      // forzar: se usa cuando la persona acaba de intentar instalar. En ese
      // caso el aviso importa aunque haya cerrado el cartel dias atras.
      function mostrar(forzar) {
        if (!cartel.hidden || estaInstalada()) return;
        if (!forzar && descartadoHacePoco()) return;
        // El ícono del cartel se pide recién ahora, para no sumarlo a la carga
        // inicial de la pantalla.
        var icono = cartel.querySelector('[data-src]');
        if (icono) {
          icono.src = icono.getAttribute('data-src');
          icono.removeAttribute('data-src');
        }
        cartel.hidden = false;
        document.body.classList.add('has-install');
        // Fuerza un reflow para que el navegador registre la posición inicial
        // y la transición se vea. (No usamos requestAnimationFrame porque no
        // se dispara si la pestaña está en segundo plano.)
        void cartel.offsetWidth;
        cartel.classList.add('is-visible');
        ajustarEspacio();
      }

      function ocultar() {
        cartel.classList.remove('is-visible');
        document.body.classList.remove('has-install');
        document.body.style.paddingBottom = '';
        setTimeout(function () { cartel.hidden = true; }, 320);
      }

      // El ícono real de "Compartir" de iOS, para que no haya que adivinar
      // cuál es.
      var GLIFO_COMPARTIR =
        '<svg class="install__glifo" viewBox="0 0 24 24" aria-hidden="true">' +
        '<path d="M8.6 10.4H7a1.5 1.5 0 0 0-1.5 1.5v8a1.5 1.5 0 0 0 1.5 1.5h10a1.5 ' +
        '1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5h-1.6M12 14.6V3.2m0 0L8.7 6.5' +
        'M12 3.2l3.3 3.3" fill="none" stroke="currentColor" stroke-width="1.9" ' +
        'stroke-linecap="round" stroke-linejoin="round"/></svg>';

      // Los pasos que hay que seguir cuando el navegador no ofrece el diálogo
      // nativo. Se arma según dónde esté abierta la página.
      function textoDePasos() {
        if (esNavegadorDeApp()) {
          return '<strong>Este navegador no puede instalar apps.</strong> ' +
                 'Tocá el menú <strong>⋯</strong> arriba a la derecha y elegí ' +
                 '<strong>"Abrir en el navegador"</strong> (Chrome o Safari). ' +
                 'Ahí sí vas a poder instalarla.';
        }
        if (esOtroNavegadorEnIOS()) {
          return '<strong>Abrí este enlace en Safari</strong> para poder ' +
                 'instalarla. En iPhone, agregar una app a la pantalla de ' +
                 'inicio solo funciona bien desde Safari.';
        }
        if (esIOS()) {
          // iPhone no tiene instalación con un toque: Apple no le da esa
          // posibilidad a las páginas web. Solo se puede guiar a la persona.
          return '<strong>En iPhone lo hace Apple, no la app.</strong> Son 3 toques:' +
                 '<span class="install__paso">1. Tocá ' + GLIFO_COMPARTIR +
                 ' <strong>Compartir</strong>, en la barra de abajo.</span>' +
                 '<span class="install__paso">2. Deslizá hacia abajo y elegí ' +
                 '<strong>"Agregar a inicio"</strong>.</span>' +
                 '<span class="install__paso">3. Tocá <strong>Agregar</strong>, ' +
                 'arriba a la derecha.</span>' +
                 '<span class="install__flecha" aria-hidden="true">↓</span>';
        }
        var pasosAndroid =
          '<span class="install__paso">1. Tocá el menú <strong>⋮</strong> arriba a la derecha.</span>' +
          '<span class="install__paso">2. Elegí <strong>"Instalar aplicación"</strong> o ' +
          '<strong>"Agregar a pantalla principal"</strong>.</span>';
        if (esSamsung()) {
          pasosAndroid += '<span class="install__paso">Si aparece un aviso de ' +
            '<strong>Play Protect</strong>, instalala desde <strong>Chrome</strong>: ' +
            'es el paquete que arma este navegador, no la página.</span>';
        }
        return pasosAndroid;
      }

      function alternarPasos() {
        if (pasos.hidden) {
          pasos.innerHTML = textoDePasos();
          pasos.hidden = false;
          cartel.classList.add('is-expandido');
          boton.setAttribute('aria-expanded', 'true');
          ajustarEspacio();
          // Si el cartel quedó en el flujo (pantalla baja), puede estar fuera
          // de la vista: lo traemos.
          if (getComputedStyle(cartel).position !== 'fixed') {
            cartel.scrollIntoView({ block: 'end', behavior: 'smooth' });
          }
          return;
        }
        pasos.hidden = true;
        cartel.classList.remove('is-expandido');
        boton.setAttribute('aria-expanded', 'false');
        ajustarEspacio();
      }

      // Camino 1: Android / Chrome / Edge. Puede llegar en cualquier momento,
      // incluso después de que el cartel ya se mostró con las instrucciones.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        promptDiferido = e;
        pasos.hidden = true;
        cartel.classList.remove('is-expandido');
        boton.setAttribute('aria-expanded', 'false');
        pista.textContent = 'Queda como ícono en tu celular';
        mostrar();
        ajustarEspacio();
      });

      // Cuando la instalación se completa de verdad, el navegador dispara
      // 'appinstalled'. Si la persona aceptó y ese aviso no llega, algo la
      // frenó: en Android el sospechoso habitual es Play Protect bloqueando
      // el APK que genera Samsung Internet. En ese caso se vuelve a mostrar
      // el cartel explicando cómo salir del paso.
      var seInstalo = false;
      var ESPERA_INSTALACION = 15000;

      function avisarQueNoSeInstalo() {
        if (seInstalo || estaInstalada()) return;
        pista.textContent = '¿No se instaló? Mirá esto';
        pasos.innerHTML = falloDeInstalacion;
        pasos.hidden = false;
        cartel.classList.add('is-expandido');
        boton.setAttribute('aria-expanded', 'true');
        cartel.hidden = true;   // para que mostrar() no corte de entrada
        mostrar(true);
      }

      var falloDeInstalacion =
        '<strong>Android puede haber bloqueado la instalación.</strong> ' +
        'El aviso de Play Protect no es por esta página: es por el paquete ' +
        'que arma el navegador para instalarla.' +
        '<span class="install__paso">La salida más simple: abrí este mismo ' +
        'enlace en <strong>Chrome</strong> y tocá Instalar de nuevo.</span>' +
        '<span class="install__paso">Si igual no te deja, tocá el menú ' +
        '<strong>⋮</strong> y elegí <strong>"Agregar a pantalla de inicio"</strong>: ' +
        'el ícono te queda igual.</span>';

      boton.addEventListener('click', function () {
        if (!promptDiferido) {
          alternarPasos();
          return;
        }
        promptDiferido.prompt();
        promptDiferido.userChoice.then(function (eleccion) {
          promptDiferido = null;
          if (eleccion.outcome !== 'accepted') return;
          ocultar();
          // Se le da tiempo: generar el paquete puede tardar unos segundos.
          setTimeout(avisarQueNoSeInstalo, ESPERA_INSTALACION);
        });
      });

      cerrar.addEventListener('click', function () {
        try { localStorage.setItem(CLAVE_DESCARTE, String(Date.now())); } catch (e) {}
        ocultar();
      });

      // Cuando el sistema confirma la instalación, el cartel ya no va más.
      window.addEventListener('appinstalled', function () {
        seInstalo = true;
        try { localStorage.setItem(CLAVE_DESCARTE, String(Date.now())); } catch (e) {}
        ocultar();
      });

      // Si la pantalla rota o cambia de tamaño, se recalcula el espacio.
      window.addEventListener('resize', ajustarEspacio);

      if (estaInstalada()) return;

      // Camino 2: el resto. Se muestra el cartel igual, con el botón que
      // despliega los pasos. En Chrome se espera un poco por si llega el
      // evento nativo, así no aparecen instrucciones que no hacen falta.
      var espera = (esIOS() || esNavegadorDeApp()) ? 1200 : 3000;
      setTimeout(function () {
        if (esNavegadorDeApp()) {
          pista.textContent = 'Abrila en Chrome o Safari para instalarla';
        } else if (esIOS()) {
          pista.textContent = 'Agregala a tu pantalla de inicio';
        } else if (!promptDiferido) {
          pista.textContent = 'Instalala desde el menú del navegador';
        }
        mostrar();
      }, espera);
    })();
  </script>
</body>
</html>
